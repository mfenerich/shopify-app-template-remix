# Default app config for CLI. Prefer `shopify.app.poc-nextphone-onboarding.toml` when both exist;
# keep these in sync (same client_id, URLs, scopes).

client_id = "718701678911bc5b20d0cb1769f846a1"
name = "poc-nextphone-onboarding"
application_url = "https://mobile-onboarding-stage.revendo.com:8889"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
scopes = "write_products"

[auth]
redirect_urls = [ "https://mobile-onboarding-stage.revendo.com:8889/auth/callback" ]

[app_proxy]
url = "https://europe-west6-shopify-458710.cloudfunctions.net/numbers_proxy"
subpath = "numbers"
prefix = "apps"
