# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration
#
# Production: set application_url and [auth] redirect_urls in Partner Dashboard
# to your real app URL. `shopify app dev` can override URLs locally when
# automatically_update_urls_on_dev is true.

client_id = "ca95ce5747094c2ace99b7b1b5335119"
name = "poc-nextphone-onboarding"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
# Align with Admin API version in app/shopify.server.ts (ApiVersion.January26 → 2026-01)
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Required for default Remix template Admin demo (productCreate). Sync with SCOPES in .env.
scopes = "write_products"

[auth]
# Replace with production callback URL(s); e.g. https://your-app.com/auth/callback
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]
