api_version = "2026-01"

[[extensions]]
uid = "047f6bf8-a5f1-e462-0366-1698afe7d52039b67a60"
type = "ui_extension"
name = "Mobile Plan Onboarding"
handle = "mobile-plan-onboarding"

[[extensions.targeting]]
target = "purchase.checkout.block.render"
module = "./src/Checkout.tsx"

# Preload product metafields into checkout (also enables appMetafields for this key).
[[extensions.metafields]]
namespace = "custom"
key = "monthly_price"

[extensions.capabilities]
network_access = true
api_access = true
block_progress = true

[extensions.settings]

  [[extensions.settings.fields]]
  key = "numbers_api_origin"
  type = "single_line_text_field"
  name = "Numbers API origin"
  description = "Base URL of the Remix app for number pool API calls (e.g. https://mobile-onboarding.example.com). No trailing slash."
